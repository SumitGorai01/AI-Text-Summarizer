<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Text Summarizer App</title>
    <link rel="stylesheet" href="./stylesheet.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <header>
      <h1 class="animated-header">AI Text <span>Summarizer</span></h1>
      <p class="tagline">
        Paste any text and get an instant AI-powered summary.
      </p>
      <button id="themeToggle" class="theme-toggle">
        <i class="fa-solid fa-moon"></i>
      </button>
    </header>

    <main class="container">
      <!-- Input Card -->
      <div class="card">
        <h2>Input Text</h2>
        <textarea
          id="text_to_summarize"
          placeholder="Paste text here (Min: 200 chars, Max: 100,000 chars)..."
          maxlength="100000"
        ></textarea>
        <div class="info-bar">
          <div id="typedCharCount">0 / 100,000</div>
          <div class="summary-options">
            <label for="summaryLength">Summary Style: </label>
            <select id="summaryLength">
              <option value="short">Short</option>
              <option value="medium" selected>Medium</option>
              <option value="detailed">Detailed</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button id="submit-button" class="btn primary">
            <span class="submit-button-text">Summarize</span>
          </button>
        </div>
      </div>

      <!-- Output Card -->
      <div class="card">
        <h2>Summary</h2>
        <textarea
          id="summary"
          placeholder="Summarized text will appear here..."
          readonly
        ></textarea>
        <div id="summaryCount" class="summary-count"></div>
        <div class="actions">
          <button id="copyText" class="btn secondary" style="display: none">
            <i class="fa-regular fa-copy"></i> Copy
          </button>
          <button id="downloadText" class="btn secondary" style="display: none">
            <i class="fa-solid fa-download"></i> Download
          </button>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-content">
        <p>© 2024 AI Text Summarizer. All Rights Reserved. Made with ❤️ By Sumit Gorai</p>
        <div class="socials">
          <a href="https://www.linkedin.com/in/sumitgorai01/"
            ><i class="fa-brands fa-linkedin"></i
          ></a>
          <a href="https://github.com/SumitGorai01"
            ><i class="fa-brands fa-github"></i
          ></a>
          <a href="https://sumitgorai-portfolio.netlify.app/"
            ><i class="fa-solid fa-globe"></i
          ></a>
        </div>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="./script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </body>
</html>
